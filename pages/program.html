<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/program.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    
    <div id="header"></div>

<figure class="card card--normal">
  <div class="card__image-container">
    <img src="https://cdn.bulbagarden.net/upload/thumb/e/e2/133Eevee.png/1200px-133Eevee.png" alt="Eevee" class="card__image">   
  </div>
  
  <figcaption class="card__caption">
    <h1 class="card__name">Eevee</h1>

    <h3 class="card__type">
      normal
    </h3>

    <table class="card__stats">
      <tbody><tr>
        <th>HP</th>
        <td>55</td>
      </tr>
      <tr>
        <th>Attack</th>
        <td>55</td>
      </tr>
      
      <tr>
        <th>Defense</th>
        <td>50</td>
      </tr>

      <tr>
        <th>Special Attack</th>
        <td>45</td>
      </tr>
      <tr>
        <th>Special Defense</th>
        <td>65</td>
      </tr>
      <tr>
        <th>Speed</th>  
        <td>55</td>
      </tr>
    </tbody></table>
    
    <div class="card__abilities">
      <h4 class="card__ability">
        <span class="card__label">Ability</span>
        Run Away
      </h4>
      <h4 class="card__ability">
        <span class="card__label">Hidden Ability</span>
        Anticipation
      </h4>
    </div>
  </figcaption>
</figure>

<figure class="card card--water">
  <div class="card__image-container">
    <img src="https://cdn.bulbagarden.net/upload/thumb/f/fd/134Vaporeon.png/1200px-134Vaporeon.png" alt="Vaporeon" class="card__image">   
  </div>
  
  <figcaption class="card__caption">
    <h1 class="card__name">Vaporeon</h1>

    <h3 class="card__type">
      water
    </h3>

    <table class="card__stats">
      <tbody><tr>
        <th>HP</th>
        <td>130</td>
      </tr>
      <tr>
        <th>Attack</th>
        <td>65</td>
      </tr>
      
      <tr>
        <th>Defense</th>
        <td>60</td>
      </tr>

      <tr>
        <th>Special Attack</th>
        <td>110</td>
      </tr>
      <tr>
        <th>Special Defense</th>
        <td>95</td>
      </tr>
      <tr>
        <th>Speed</th>  
        <td>65</td>
      </tr>
    </tbody></table>
    
    <div class="card__abilities">
      <h4 class="card__ability">
        <span class="card__label">Ability</span>
        Absorb
      </h4>
      <h4 class="card__ability">
        <span class="card__label">Hidden Ability</span>
        Hydration
      </h4>
    </div>
  </figcaption>
</figure>


    <div id="footer"></div>
    <script src="/tentang.js"></script>
    <script src="/main.js"></script>
</body>
</html>
